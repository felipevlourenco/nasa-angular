<div>
    <h1>Home page</h1>
    @if (loading()) {
        <loading />
    } @else if (error()) {
        <p>{{ error() }}</p>
    } @else {
        <ul>
            @for (obj of objects(); track obj.objectName) {
                <li>{{ obj.objectName }} — rating: {{ obj.rating }}</li>
            }
        </ul>
    }
</div>
