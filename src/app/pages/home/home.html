<div>
    <h1>Home page</h1>
    @if (loading()) {
        <loading />
    } @else if (error()) {
        <p>{{ error() }}</p>
    } @else {
        <ag-grid-angular
            style="height: 500px; width: 100%"
            [theme]="theme"
            [columnDefs]="columnDefs"
            [rowData]="objects()"
        />
    }
</div>
