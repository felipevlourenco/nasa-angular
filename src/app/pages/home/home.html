<div>
    <h1>Home page</h1>
    @if (store.loading()) {
        <loading />
    } @else if (store.error()) {
        <p>{{ store.error() }}</p>
    } @else {
        <ag-grid-angular
            style="height: 500px; width: 100%"
            [theme]="theme"
            [columnDefs]="columnDefs"
            [rowData]="store.objects()"
        />
    }
</div>
